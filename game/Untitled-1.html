<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素贪吃蛇</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Courier New', monospace;
        }
        .game-container { text-align: center; }
        h1 { color: #00ff88; margin-bottom: 20px; font-size: 32px; text-shadow: 0 0 10px #00ff88; }
        #score { color: #fff; font-size: 20px; margin-bottom: 10px; }
        canvas { border: 4px solid #00ff88; box-shadow: 0 0 20px rgba(0, 255, 136, 0.5); }
        .info { color: #888; margin-top: 15px; font-size: 14px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .overlay h2 { color: #ff4444; font-size: 48px; margin-bottom: 20px; }
        .overlay p { color: #fff; font-size: 24px; margin-bottom: 30px; }
        .overlay button { padding: 15px 40px; font-size: 20px; background: #00ff88; border: none; color: #1a1a2e; cursor: pointer; font-family: inherit; }
        .overlay button:hover { background: #00cc6a; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>贪吃蛇</h1>
        <div id="score">得分: 0</div>
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <p class="info">方向键或 WASD 控制移动</p>
    </div>
    <div id="gameOver" class="overlay hidden">
        <h2>游戏结束</h2>
        <p>得分: <span id="finalScore">0</span></p>
        <button onclick="restartGame()">重新开始</button>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const gameOverDisplay = document.getElementById('gameOver');
        const finalScoreDisplay = document.getElementById('finalScore');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        let snake = [];
        let food = {};
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let gameRunning = true;
        let gameLoop;
        const gameSpeed = 180;

        function initGame() {
            snake = [{ x: 15, y: 15 }, { x: 14, y: 15 }, { x: 13, y: 15 }];
            score = 0;
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            gameRunning = true;
            scoreDisplay.textContent = '得分: 0';
            gameOverDisplay.classList.add('hidden');
            placeFood();
        }

        function placeFood() {
            do {
                food = { x: Math.floor(Math.random() * tileCount), y: Math.floor(Math.random() * tileCount) };
            } while (snake.some(seg => seg.x === food.x && seg.y === food.y));
        }

        function drawPixel(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * gridSize + 1, y * gridSize + 1, gridSize - 2, gridSize - 2);
        }

        function draw() {
            ctx.fillStyle = '#16213e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawPixel(food.x, food.y, '#ff4444');
            drawPixel(snake[0].x, snake[0].y, '#00ff88');
            for (let i = 1; i < snake.length; i++) drawPixel(snake[i].x, snake[i].y, '#00cc6a');
        }

        function update() {
            if (!gameRunning) return;
            direction = nextDirection;
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) { gameOver(); return; }
            if (snake.some(seg => seg.x === head.x && seg.y === head.y)) { gameOver(); return; }
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) { score += 10; scoreDisplay.textContent = '得分: ' + score; placeFood(); } else { snake.pop(); }
        }

        function gameOver() { gameRunning = false; finalScoreDisplay.textContent = score; gameOverDisplay.classList.remove('hidden'); }

        function restartGame() { initGame(); gameLoop = setInterval(() => { update(); draw(); }, gameSpeed); }

        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp': case 'w': case 'W': if (direction.y !== 1) nextDirection = { x: 0, y: -1 }; break;
                case 'ArrowDown': case 's': case 'S': if (direction.y !== -1) nextDirection = { x: 0, y: 1 }; break;
                case 'ArrowLeft': case 'a': case 'A': if (direction.x !== 1) nextDirection = { x: -1, y: 0 }; break;
                case 'ArrowRight': case 'd': case 'D': if (direction.x !== -1) nextDirection = { x: 1, y: 0 }; break;
            }
        });

        initGame();
        gameLoop = setInterval(() => { update(); draw(); }, gameSpeed);
    </script>
</body>
</html>
